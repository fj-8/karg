name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push to a branch supersedes the run before it, so the older one is
# cancelled instead of queueing. A run on main is never cancelled: main is the
# release, and its history is the evidence the READMEs point at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit-deps:
    name: Zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any package other than karg appears in the lock file
        run: |
          awk '/^\[\[package\]\]/{n++} END{exit (n>1)}' Cargo.lock
          ! grep -Eq '^(dotenv|reqwest|serde|syn|quote|proc-macro2)' Cargo.lock

  test:
    name: Test ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.74"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo run --release --example bench --features bench
      - run: cargo run --example crop -- --help
      - run: cargo run --example gitlike -- branch list --sort date -a

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features
